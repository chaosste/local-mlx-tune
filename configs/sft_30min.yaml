# ~30 minute SFT on M1 8GB — data/train.jsonl (66 rows after WHAT_IS merge)

model: models/mlx/gemma3-1b-heretic-4bit

max_seq_length: 1024
load_in_4bit: true

lora:
  r: 8
  lora_alpha: 8
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj

data:
  train_file: data/train.jsonl

training:
  # ~1650 steps × ~1.0 s/step ≈ 28 min training + checkpoints/eval ≈ 30 min total
  output_dir: outputs/runs/gemma3-30min-whatis
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 1.5e-4
  max_steps: 1650
  logging_steps: 10
  save_steps: 50
  grad_checkpoint: true
  val_batches: 0
  steps_per_eval: 1650

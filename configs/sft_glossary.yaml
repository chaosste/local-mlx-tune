# Glossary-only SFT — data/glossary.jsonl (WHAT_IS defs, no Example blocks)

model: models/mlx/gemma3-1b-heretic-4bit

max_seq_length: 1024
load_in_4bit: true

lora:
  r: 8
  lora_alpha: 8
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj

data:
  train_file: data/glossary.jsonl

training:
  # ~14 rows — stop early; 150 steps ≈ several epochs without memorizing to ~0.6 loss
  output_dir: outputs/runs/gemma3-glossary
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 1.5e-4
  max_steps: 150
  logging_steps: 10
  save_steps: 50
  grad_checkpoint: true
  val_batches: 0
  steps_per_eval: 150

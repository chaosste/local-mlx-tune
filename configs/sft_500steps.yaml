# ~500-step SFT on M1 8GB — data/train.jsonl (53 Q&A pairs, longer answers)

model: models/mlx/gemma3-1b-heretic-4bit

max_seq_length: 2048
load_in_4bit: true

lora:
  r: 8
  lora_alpha: 8
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj

data:
  train_file: data/train.jsonl

training:
  output_dir: outputs/runs/gemma3-500-2048
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 1.5e-4
  max_steps: 500
  logging_steps: 10
  save_steps: 100
  grad_checkpoint: true
  val_batches: 0
  steps_per_eval: 500

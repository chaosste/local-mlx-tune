# Unambitious SFT defaults for M1 8GB — used by scripts/03_train_sft.py
model: models/mlx/my-uncensored-base-4bit
# Fast path (skip GGUF): mlx-community/Llama-3.2-1B-Instruct-4bit

max_seq_length: 1024
load_in_4bit: true

lora:
  r: 8
  lora_alpha: 8
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj

data:
  train_file: data/train.jsonl

training:
  output_dir: outputs/adapters
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  max_steps: 100
  logging_steps: 5
  save_steps: 50

# mlx_lm.lora CLI fallback (smallest footprint):
# mlx_lm.lora --model <model> --train --data ./data --iters 100 \
#   --batch-size 1 --num-layers 4 --mask-prompt --grad-checkpoint
